<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Future Lab</title>
<style>
:root{--bg:#e9ebee;--panel:#f3f4f4;--card:#fff;--ink:#101513;--mute:#8b9490;--line:#e6e9e8;--g1:#0d4d33;--g2:#1c8454;--g3:#7fc7a1;--g4:#dcefe5;--amber:#d99a2b;--red:#d9604f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Plus Jakarta Sans",Manrope,"SF Pro Display",system-ui,-apple-system,"Segoe UI",sans-serif}
a{color:var(--g2)}
.frame{max-width:1360px;margin:26px auto;background:#fff;border-radius:34px;padding:14px;display:grid;grid-template-columns:218px 1fr;gap:12px;box-shadow:0 24px 60px rgba(20,30,25,.08)}
.side{background:var(--panel);border-radius:24px;padding:20px 14px 14px;display:flex;flex-direction:column;min-height:640px}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:20px;padding:0 6px 22px}
.logo svg{width:30px;height:30px}
.sec{font-size:12px;color:var(--mute);letter-spacing:.04em;margin:14px 8px 8px}
.nav a{position:relative;display:flex;align-items:center;gap:12px;padding:9px 8px;margin:1px 0;border-radius:10px;color:#8e9793;text-decoration:none;font-weight:500}
.nav a:hover{color:var(--ink)}.nav a.on{color:var(--ink);font-weight:700}
.nav a.on::before{content:"";position:absolute;left:-14px;top:7px;bottom:7px;width:4px;border-radius:0 4px 4px 0;background:var(--g2)}
.nav a.on svg{color:var(--g2)}.badge{margin-left:auto;background:var(--g1);color:#fff;border-radius:6px;font-size:11px;padding:1px 6px}
.promo{margin-top:auto;border-radius:20px;padding:16px;color:#fff;background:radial-gradient(circle at 90% 10%,rgba(255,255,255,.14),transparent 45%),repeating-radial-gradient(circle at 85% 95%,rgba(255,255,255,.07) 0 2px,transparent 2px 10px),linear-gradient(145deg,#0b3d28,#1a7a4b)}
.promo b{font-size:15px;display:block;line-height:1.25}.promo .s{font-size:11px;opacity:.75;margin:4px 0 12px}
.main{display:flex;flex-direction:column;gap:12px;min-width:0}
.top{background:var(--panel);border-radius:24px;padding:10px 14px;display:flex;align-items:center;gap:10px}
.search{flex:0 1 330px;display:flex;align-items:center;gap:8px;background:#fff;border-radius:999px;padding:10px 14px;color:var(--mute)}
.search input{border:0;outline:0;flex:1;font:inherit;background:transparent;min-width:0}
kbd{background:#ececec;border-radius:6px;padding:1px 7px;font-size:11px;color:#6b7470;font-family:inherit}
.sp{flex:1}.ibtn{width:42px;height:42px;border-radius:50%;background:#fff;display:grid;place-items:center;border:0;color:#333;cursor:pointer}
.who{display:flex;align-items:center;gap:10px}.av{width:42px;height:42px;border-radius:50%;background:linear-gradient(145deg,var(--g3),var(--g2));display:grid;place-items:center;color:#fff;font-weight:700}
.who b{display:block;font-size:14px;line-height:1.15}.who span{font-size:12px;color:var(--mute)}
.panel{background:var(--panel);border-radius:24px;padding:20px;min-height:560px}
.head{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:16px}.head h1{margin:0;font-size:36px;line-height:1.1;letter-spacing:-.02em}
.head p{margin:6px 0 0;color:var(--mute)}.head .act{margin-left:auto;display:flex;gap:10px}
.btn{border:0;border-radius:999px;padding:12px 22px;font:inherit;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:8px;text-decoration:none}
.btn.pri{background:linear-gradient(135deg,#0f5a3a,#1c8454);color:#fff}.btn.out{background:transparent;color:var(--g1);border:1.5px solid var(--g1)}
.btn.sm{padding:7px 14px;font-size:13px}.btn.soft{background:#fff;color:var(--ink);border:1px solid var(--line)}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.card{background:var(--card);border-radius:20px;padding:16px;min-width:0}.card h3{margin:0 0 10px;font-size:16px}
.span2{grid-column:span 2}.dark{color:#fff;background:radial-gradient(circle at 85% 15%,rgba(255,255,255,.16),transparent 40%),linear-gradient(145deg,#0c4a31,#1c8454)}
.stat .t{display:flex;align-items:center;justify-content:space-between;font-weight:600}.stat .n{font-size:46px;font-weight:600;line-height:1.1;margin:10px 0 4px;letter-spacing:-.02em}
.arrow{width:32px;height:32px;border-radius:50%;border:1.5px solid #222;display:grid;place-items:center;color:#222;text-decoration:none}.dark .arrow{background:#fff;border-color:#fff;color:var(--g1)}
.chip{display:inline-block;font-size:11px;border-radius:6px;padding:1px 7px;border:1px solid var(--g3);color:var(--g2);background:#fff}.sub{font-size:12px;color:var(--g2)}.dark .sub{color:#b6e7cb}
.mute{color:var(--mute)}.small{font-size:13px}
.bars{display:flex;justify-content:space-between;align-items:flex-end;height:170px;gap:6px;padding-top:12px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;font-size:12px;color:var(--mute);position:relative}
.pill{width:100%;max-width:40px;border-radius:999px;background:repeating-linear-gradient(135deg,#c9d1cc 0 2px,#eef0ef 2px 7px)}
.pill.a{background:var(--g3)}.pill.b{background:var(--g2)}.pill.c{background:var(--g1)}.tip{position:absolute;top:-6px;background:#fff;border:1px solid var(--line);border-radius:6px;font-size:10px;padding:0 5px;color:var(--ink)}
.rem .big{font-size:20px;font-weight:700;color:var(--g1);line-height:1.2;margin:6px 0}.rem .btn{width:100%;justify-content:center;margin-top:12px}
.list .it{display:flex;gap:10px;align-items:center;padding:7px 0;text-decoration:none;color:inherit}
.dot{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff;flex:none}
.list .it b{display:block;font-size:13px;line-height:1.2}.list .it span{font-size:11px;color:var(--mute)}
.mem{display:flex;align-items:center;gap:10px;padding:7px 0}.mem .av2{width:34px;height:34px;border-radius:50%;background:var(--g4);color:var(--g1);display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}
.mem b{font-size:13px;display:block;line-height:1.15}.mem span{font-size:11px;color:var(--mute)}.st{margin-left:auto;font-size:10px;border-radius:5px;padding:1px 7px;border:1px solid;white-space:nowrap}
.st.c{color:var(--g2);border-color:var(--g3);background:#eaf6ef}.st.p{color:var(--amber);border-color:#f0cf93;background:#fdf5e6}.st.w{color:var(--red);border-color:#efb3aa;background:#fdeeec}
.gauge{text-align:center}.gauge svg{width:100%;max-width:230px}.gauge .pc{font-size:44px;font-weight:700;margin-top:-62px;letter-spacing:-.02em}.gauge .l{font-size:12px;color:var(--g2);margin-bottom:10px}
.legend{display:flex;gap:10px;justify-content:center;font-size:11px;flex-wrap:wrap}.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px}
.timer{color:#fff;text-align:center;background:repeating-radial-gradient(ellipse at 60% 120%,rgba(255,255,255,.08) 0 2px,transparent 2px 9px),linear-gradient(150deg,#0a3a26,#1b7d4e)}
.timer h3{text-align:left}.timer .tt{font-size:40px;font-weight:600;letter-spacing:.02em;margin:6px 0 10px}.tbtn{width:46px;height:46px;border-radius:50%;border:0;cursor:pointer;display:inline-grid;place-items:center;margin:0 5px}
.flame{color:#f08a24}.strip{display:flex;gap:4px;margin-top:8px}.strip i{flex:1;height:8px;border-radius:4px;background:rgba(255,255,255,.22)}.strip i.on{background:#fff}
.day{display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}.day:first-child{border-top:0}
.day input[type=checkbox]{margin-top:4px;width:19px;height:19px;accent-color:var(--g2);flex:none}.day.done .t{color:var(--mute);text-decoration:line-through}
.day ul{margin:2px 0 6px 18px;padding:0}.res{color:var(--g2)}
textarea,input[type=text],input[type=number]{width:100%;background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:9px 11px;font:inherit}
textarea{min-height:76px;resize:vertical}pre{white-space:pre-wrap;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;font:13px/1.5 inherit;margin:8px 0}
.tag{display:inline-block;padding:1px 9px;border-radius:99px;border:1px solid var(--line);font-size:12px;color:var(--mute);margin-right:6px;background:#fff}.tag.g{color:var(--g2);border-color:var(--g3)}.tag.w{color:var(--amber);border-color:#f0cf93}
.wk{display:block;padding:12px;border-radius:16px;text-decoration:none;color:var(--ink);background:#fff;border:1.5px solid transparent}.wk.pass{border-color:var(--g3)}.wk.cur{border-color:var(--amber)}
.g4{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}table{width:100%;border-collapse:collapse}td,th{border-top:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}
.cal{display:grid;grid-template-columns:70px repeat(7,1fr);gap:4px;align-items:center;font-size:12px}.cal .c{height:26px;border-radius:7px;background:#eceeed}.cal .c.d{background:var(--g2)}.cal .c.t{background:var(--g1)}.cal .c.r{background:var(--g3)}.cal .c.td{outline:2px solid var(--amber)}
.idcard{border:2px solid var(--g2);border-radius:20px;padding:22px;max-width:480px;background:#fff}.idcard.lock{opacity:.5;border-style:dashed}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--g1);color:#fff;padding:13px 20px;border-radius:14px;font-weight:600;max-width:90vw;display:none;z-index:9;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.chip2{display:inline-block;margin:2px 6px 2px 0;padding:3px 11px;border-radius:999px;font-size:12px;text-decoration:none;border:1px solid var(--g3);background:#fff;color:var(--ink)}.chip2.video{border-color:#efb3aa}.chip2.practice{border-color:#a9c5ee}.chip2:hover{background:#f0f8f3}
.room{display:grid;grid-template-columns:minmax(330px,440px) minmax(0,1fr);gap:12px;align-items:start}.rl{display:flex;flex-direction:column;gap:10px}
.res-btn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:9px 11px;font:inherit;color:inherit;cursor:pointer}.res-btn.on{border-color:var(--g2);background:#f0f8f3}
.ty{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:#fff;flex:none;font-size:13px}.ty.read{background:#1c8454}.ty.video{background:#d9604f}.ty.practice{background:#3a7bd5}
.reader{position:sticky;top:12px;display:flex;flex-direction:column;height:calc(100vh - 36px);min-height:540px;overflow:hidden}.reader iframe{flex:1;border:0;width:100%;min-height:0;background:#fff}
.bar2{display:flex;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.know label{display:flex;gap:10px;align-items:flex-start;padding:6px 0;cursor:pointer}.know input,.card label input[type=checkbox]{width:18px;height:18px;accent-color:var(--g2);margin-top:2px;flex:none}
.steps{display:flex;gap:6px}.steps span{flex:1;height:7px;border-radius:5px;background:var(--line)}.steps span.on{background:var(--g2)}
.conf{position:fixed;top:-16px;width:9px;height:14px;z-index:30;border-radius:2px;animation:fall 2s ease-in forwards;pointer-events:none}@keyframes fall{to{transform:translateY(108vh) rotate(600deg)}}
@media(max-width:1000px){.room{grid-template-columns:1fr}.reader{position:static;height:75vh}}
@media(max-width:1000px){.frame{grid-template-columns:1fr;margin:0;border-radius:0}.side{min-height:0}.grid{grid-template-columns:repeat(2,1fr)}.span2{grid-column:span 2}.head h1{font-size:28px}}
@media(max-width:560px){.grid{grid-template-columns:1fr}.span2{grid-column:auto}.search{display:none}}
</style>
</head>
<body>
<div class="frame">
  <aside class="side">
    <div class="logo"><svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="16" fill="none" stroke="#1c8454" stroke-width="5"/><circle cx="20" cy="20" r="6" fill="#0d4d33"/></svg>Future Lab</div>
    <div class="sec">MENU</div><nav class="nav" id="nav1"></nav>
    <div class="sec">GENERAL</div><nav class="nav" id="nav2"></nav>
    <div class="promo"><b>Back up to GitHub</b><div class="s" id="ghs">checking...</div><button class="btn sm soft" id="syncbtn" style="width:100%;justify-content:center;background:#0b3d28;color:#fff;border:0">Sync now</button>
      <div class="s" id="upds" style="margin:12px 0 6px">checking for updates...</div><button class="btn sm soft" id="updbtn" style="width:100%;justify-content:center;background:rgba(255,255,255,.18);color:#fff;border:0">Check for updates</button></div>
  </aside>
  <div class="main">
    <header class="top">
      <label class="search"><span id="ic-search"></span><input id="q" placeholder="Search task" autocomplete="off"><kbd>&#8984; F</kbd></label>
      <span class="sp"></span>
      <a class="ibtn" href="#posts" title="LinkedIn drafts" id="ic-mail"></a><a class="ibtn" href="#tasks" title="Reminders" id="ic-bell"></a>
      <a class="who" href="#id" style="text-decoration:none;color:inherit"><span class="av" id="av">S</span><div><b id="whoname">Learner</b><span id="wholvl"></span></div></a>
    </header>
    <section class="panel" id="view"></section>
  </div>
</div>
<div id="toast"></div>
<script src="curriculum.js"></script>
<script src="days_1.js"></script><script src="days_2.js"></script><script src="days_3.js"></script><script src="links.js"></script>
<script>
const C = window.CURRICULUM, WK = C.weeks, DAYS = window.DAYS || {}, TOTAL_DAYS = WK.length * 6;
const PRAISE = ["Done. That is how real skill is built: one honest day at a time.","Good. You did the work, not just watched it.","Another brick placed. Keep the chain going.","Correct move: you finished the hard part instead of skipping it.","That is progress you can show someone.","Quiet, steady, real. This is what separates people who get good."];
const TESTPASS = ["Gate passed. You proved it, not just read it.","You earned this one. Proof beats feeling.","Passed honestly. Your future self thanks you."];
const TITLES = [[1,"Newcomer"],[10,"Shell Explorer"],[20,"Server Keeper"],[30,"Data Builder"],[40,"Stats Thinker"],[50,"Model Trainer"],[60,"Agent Builder"],[70,"Evals Engineer"],[80,"Secure Operator"],[90,"Systems Designer"],[100,"AI Engineer"]];
const IC = {
 dash:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
 tasks:'<circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/>', road:'<path d="M4 6h16M4 12h16M4 18h10"/>',
 cal:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/>', chart:'<path d="M5 20V10M12 20V4M19 20v-7"/>',
 notes:'<path d="M6 3h9l4 4v14H6z"/><path d="M9 12h7M9 16h7"/>', post:'<path d="M21 4L3 11l7 3 3 7z"/>',
 ai:'<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/>', books:'<path d="M4 5a2 2 0 012-2h13v16H6a2 2 0 00-2 2z"/><path d="M4 21V5"/>',
 id:'<rect x="3" y="5" width="18" height="14" rx="3"/><circle cx="9" cy="11" r="2"/><path d="M14 10h4M14 14h4"/>',
 gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>',
 help:'<circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 115 0c0 1.7-2.5 2-2.5 4M12 17h.01"/>',
 search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>', mail:'<rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3 8l9 6 9-6"/>',
 bell:'<path d="M6 17V11a6 6 0 0112 0v6l2 2H4z"/><path d="M10 21h4"/>', arrow:'<path d="M7 17L17 7M9 7h8v8"/>', plus:'<path d="M12 5v14M5 12h14"/>',
 flame:'<path d="M12 3c1 4 5 5 5 10a5 5 0 01-10 0c0-2 1-3 2-4 .3 1.5 1 2 2 2 0-3-1-5 1-8z" fill="currentColor"/>',
 play:'<path d="M8 5l11 7-11 7z" fill="currentColor"/>', pause:'<path d="M9 6v12M15 6v12" stroke-width="3"/>', stop:'<rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/>',
 gh:'<path d="M9 19c-4 1.5-4-2-6-2m12 4v-3.5a3 3 0 00-.8-2.3c2.7-.3 5.5-1.3 5.5-6a4.6 4.6 0 00-1.3-3.2 4.3 4.3 0 00-.1-3.2s-1-.3-3.4 1.3a11.7 11.7 0 00-6 0C6.5 2.8 5.5 3.1 5.5 3.1a4.3 4.3 0 00-.1 3.2A4.6 4.6 0 004 9.5c0 4.6 2.8 5.7 5.5 6a3 3 0 00-.8 2.3V21"/>'
};
const ic = (n, s = 18) => `<svg viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${IC[n]}</svg>`;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const id = (w, d) => `w${w}d${d}`, pick = a => a[Math.floor(Math.random() * a.length)];
const ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;  // local date, not UTC
const today = () => ymd(new Date());
const planDate = (w, d) => { const s = new Date(C.start + "T00:00:00"); s.setDate(s.getDate() + (w-1)*7 + (d-1)); return s; };
const fmtDate = d => d.toLocaleDateString("en-GB", { day:"numeric", month:"short", year:"numeric" });

let S = { done:{}, notes:{}, tests:{}, refl:{}, books:{}, name:"", days:[], rest:[], time:{}, timer:{running:false,startedAt:0,acc:0}, posts:{}, know:{}, built:{}, last:{}, checks:{}, verified:{} }, gh = null;

// ---------- storage ----------
async function load() {
  let ok = false;
  try { const r = await fetch("/api/progress"); if (r.ok) { const j = await r.json(); if (j && Object.keys(j).length) S = { ...S, ...j }; ok = true; } } catch {}
  if (!ok) { try { const j = JSON.parse(localStorage.getItem("futurelab") || "null"); if (j) S = { ...S, ...j }; } catch {} }
  S.timer = S.timer || { running:false, startedAt:0, acc:0 };
}
let t0;
function save() {
  clearTimeout(t0);
  t0 = setTimeout(async () => {
    try { localStorage.setItem("futurelab", JSON.stringify(S)); } catch {}
    try { await fetch("/api/save", { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({ progress:S, files:buildFiles() }) }); } catch {}
    pollGh();
  }, 600);
}
async function pollGh() {
  try { gh = await (await fetch("/api/sync-status")).json(); } catch { gh = { state:"offline" }; }
  const m = { ok:`Synced ${gh.last ? ago(gh.last) : ""}`, syncing:"Syncing...", error:"Sync error: open Settings", "not-set-up":"GitHub not set up yet: see Settings", "no-remote":"Saved locally; add GitHub in Settings", idle:"Ready", offline:"Server not running: saved in this browser only" };
  const el = $("#ghs"); if (el) el.textContent = m[gh.state] || "";
}
let upd = null;
async function pollUpd() {
  try { upd = await (await fetch("/api/update-status")).json(); } catch { upd = { state:"offline" }; }
  const v = upd.version ? "v" + upd.version + " · " : "";
  const m = { ok: upd.behind ? `${v}${upd.behind} update${upd.behind > 1 ? "s" : ""} ready` : `${v}up to date`, "not-a-repo":`${v}updates not connected yet`, "no-remote":`${v}no update source yet`, error:`${v}update check failed`, offline:"offline" };
  const e = $("#upds"); if (e) e.textContent = m[upd.state] || ""; const b = $("#updbtn"); if (b) b.textContent = upd.behind ? "Update now" : "Check for updates";
}
const ago = iso => { const s = (Date.now() - new Date(iso)) / 1000; return s < 90 ? "just now" : s < 5400 ? Math.round(s/60) + " min ago" : s < 129600 ? Math.round(s/3600) + " h ago" : Math.round(s/86400) + " d ago"; };

// ---------- xp, level, streak ----------
const reflOk = w => { const r = S.refl[w]; return r && ["learned","hard","next"].every(k => (r[k]||"").trim().length >= 10); };
const weekDone = w => WK[w-1].days.filter((_,i) => S.done[id(w,i+1)]).length;
const passed = w => !!(S.tests[w] && S.tests[w].passed);
function xpOf() { let x = 0; for (const k of WK) { for (let d=1; d<=6; d++) if (S.done[id(k.n,d)]) x += 10 + ((S.notes[id(k.n,d)]||"").trim() ? 5 : 0); if (passed(k.n)) x += 100; if (reflOk(k.n)) x += 20; } return x; }
const maxXp = () => WK.length * (6*15 + 120);
const levelOf = x => Math.min(100, 1 + Math.floor(99 * x / maxXp()));
const titleOf = l => TITLES.filter(t => t[0] <= l).pop()[1];
const currentWeek = () => (WK.find(k => !passed(k.n)) || WK[WK.length-1]).n;

function bestStreak() { const a = [...activeDates()].sort(); let best = 0, run = 0, prev = null; for (const s of a) { const d = new Date(s+"T00:00:00"); run = prev && (d - prev) === 864e5 ? run + 1 : 1; prev = d; best = Math.max(best, run); } return best; }
const isoWeekKey = d => { const t = new Date(d.getFullYear(), d.getMonth(), d.getDate()); t.setDate(t.getDate() + 3 - (t.getDay()+6)%7); const w1 = new Date(t.getFullYear(),0,4); return t.getFullYear() + "-" + (1 + Math.round(((t - w1)/864e5 - 3 + (w1.getDay()+6)%7)/7)); };

function buildFiles() {
  const f = { "README.md": "# Future Lab data\nMy learning progress, notes and LinkedIn drafts, saved automatically by Future Lab.\n" };
  let md = `# My Future Lab notes\n\nLevel ${levelOf(xpOf())} (${titleOf(levelOf(xpOf()))}) | ${daysDone()}/${TOTAL_DAYS} days | streak ${streak()} days | ${Object.values(S.time).reduce((a,b)=>a+b,0)/3600 | 0} h tracked\n`;
  for (const k of WK) {
    const has = [1,2,3,4,5,6].some(d => (S.notes[id(k.n,d)]||"").trim()) || S.refl[k.n] || S.tests[k.n]; if (!has) continue;

  }

}

}
function confetti() { const cols = ["#1c8454","#7fc7a1","#d99a2b","#3a7bd5","#d9604f","#0d4d33"];
  for (let n = 0; n < 40; n++) { const e = document.createElement("i"); e.className = "conf"; e.style.left = Math.random()*100 + "vw"; e.style.background = cols[n % cols.length]; e.style.animationDelay = (Math.random()*0.5) + "s"; e.style.animationDuration = (1.4 + Math.random()) + "s"; document.body.appendChild(e); setTimeout(() => e.remove(), 3200); } }

// ---------- router and events ----------
function route(keepScroll) {
  const h = location.hash.slice(1) || "dashboard", [p, a, b, c] = h.split("/"); let html;
  switch (p) { case "week": html = vWeek(+a); break; case "day": html = vRoom(+a, +b, c); break; case "tasks": html = vTasks(); break; case "calendar": html = vCalendar(); break; case "roadmap": html = vRoadmap(); break; case "analytics": html = vAnalytics(); break;
    case "notes": html = vNotes(); break; case "posts": html = vPosts(); break; case "coach": html = vCoach(); break; case "books": html = vBooks(); break; case "id": html = vId(); break;
    case "settings": html = vSettings(); break; case "help": html = vHelp(); break; case "search": html = vSearch(decodeURIComponent(a || "")); break; default: html = vDashboard(); }
  $("#view").innerHTML = html; paintNav(p === "week" ? "roadmap" : p === "day" ? "tasks" : p); paintChrome(); if (!keepScroll) scrollTo(0, 0);
}
document.addEventListener("change", e => { const t = e.target;
  if (t.dataset.k) { setDone(t.dataset.k, t.checked); route(true); }
  if (t.dataset.know) { const [key, i] = t.dataset.know.split("|"); S.know[key] = S.know[key] || []; S.know[key][+i] = t.checked; save(); roomProgress(key); if (t.checked) markActive(); }
  if (t.dataset.built) { S.built[t.dataset.built] = t.checked; save(); roomProgress(t.dataset.built); }
  if (t.dataset.book) { S.books[t.dataset.book] = t.checked; save(); if (t.checked) toast("Book finished. Your learning capacity just grew."); }
  if (t.dataset.posted) { S.posts[t.dataset.posted].posted = t.checked; save(); route(true); }
});
document.addEventListener("input", e => { const t = e.target;
  if (t.dataset.n) { const [w, i] = t.dataset.n.slice(1).split("d").map(Number), was = (S.notes[t.dataset.n]||"").trim(); S.notes[t.dataset.n] = t.value; refreshDayPost(w, i); save(); paintChrome(); roomProgress(t.dataset.n); if (!was && t.value.trim() && S.done[t.dataset.n]) toast("Writing down what was hard is what makes it stick. Well done."); }
  if (t.dataset.r) { const w = +location.hash.split("/")[1], had = reflOk(w); S.refl[w] = S.refl[w] || {}; S.refl[w][t.dataset.r] = t.value; refreshWeekPost(w); save(); if (!had && reflOk(w)) toast("Reflection complete: +20 points. This habit is a superpower."); }
  if (t.dataset.post) { const p = S.posts[t.dataset.post]; p.text = t.value; p.edited = true; save(); }
  if (t.id === "nm") { S.name = t.value; save(); paintChrome(); }
  if (t.id === "nq") { vNotes.q = t.value; const p = t.selectionStart; route(true); const n = $("#nq"); n.focus(); n.setSelectionRange(p, p); }
});
document.addEventListener("click", e => { const t = e.target.closest("button,[data-lesson],[data-copy]") || e.target;
  const cp = txt => navigator.clipboard.writeText(txt).then(() => toast("Copied. Paste it where you need it.", 2200));
  const showPrompt = txt => {  // clipboard refused: never lose the prompt, put it on the page so it can be copied by hand
    toast("Copy failed. The prompt is on the page below: select it and copy it yourself.", 7000);
    const fb = $("#chkfb"); if (!fb) return;
    fb.innerHTML = '<div class="small" style="margin-bottom:4px"><b>Copy failed.</b> Your browser blocked the clipboard. Press "Select all", copy with Cmd+C, then paste into DeepSeek or Qwen.</div>'
      + '<textarea id="chkprompt" readonly style="min-height:160px;font-family:ui-monospace,Menlo,monospace;font-size:12px"></textarea>'
      + '<div style="margin-top:6px"><button class="btn soft sm" data-selprompt="1">Select all</button></div>';
    $("#chkprompt").value = txt;  // assigned, never interpolated: the prompt holds the learner's code and the answer key
  };
  if (t.dataset.lesson) { const x = DAYS[t.dataset.lesson]; cp(`I have 45 minutes. Teach me these things in simple English, one at a time: ${x.k.join("; ")}.\nFor each: a 3-line explanation, one tiny example I can run, and one common mistake. Then quiz me, one question at a time, with no hints before I answer. Stay consistent with this source: ${x.s}`); }
  if (t.dataset.copy) cp($("#" + t.dataset.copy).textContent);
  if (t.dataset.copypost) cp(S.posts[t.dataset.copypost].text);
  if (t.dataset.res) { const [key, i] = t.dataset.res.split("|"); S.last[key] = +i; save(); $("#reader").innerHTML = readerHtml(key, +i); document.querySelectorAll(".res-btn").forEach((b, j) => b.classList.toggle("on", j === +i)); }
  if (t.dataset.mkprompt) { const key = t.dataset.mkprompt, x = DAYS[key], code = ($("#chkcode") || {}).value || "";
    if (!code.trim()) { toast("Paste your working code first."); return; }
    fetch("/api/check-prompt", { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({ day:key, task:x.build, know:x.k, result:x.out, code, output:($("#chkout") || {}).value || "" }) })
      .then(r => r.ok ? r.json() : Promise.reject(new Error("server")))
      .then(j => Promise.resolve().then(() => navigator.clipboard.writeText(j.prompt))  // may throw outright on a blocked clipboard
        .then(() => { const fb = $("#chkfb"); if (fb) fb.innerHTML = ""; toast(`Prompt copied (${j.prompt.length} characters). Now open DeepSeek or Qwen and paste it.`, 6000); })
        .catch(() => showPrompt(j.prompt)))          // the prompt was built fine, only the copy failed
      .catch(e => { if (e && e.message === "server") toast("Could not make the prompt. Is the Future Lab server running?", 6000); }); }
  if (t.dataset.selprompt) { const ta = $("#chkprompt"); if (ta) { ta.focus(); ta.select(); ta.setSelectionRange(0, ta.value.length); } }
  if (t.dataset.popai) { const url = { deepseek:"https://chat.deepseek.com/", qwen:"https://chat.qwen.ai/" }[t.dataset.popai];
    const w = window.open(url, "futurelab_ai", `popup=yes,width=560,height=840,left=${Math.max(0, screen.availWidth - 580)},top=40`); if (!w) { toast("Pop-up blocked: allow pop-ups for localhost, then try again."); window.open(url, "_blank", "noopener"); } }
  if (t.dataset.aitab) { const key = t.dataset.aitab; $("#reader").innerHTML = `<div class="bar2"><b style="flex:1">DeepSeek chat</b><button class="btn sm soft" data-backread="${key}">Back to reading</button><a class="btn sm soft" href="https://chat.deepseek.com/" target="_blank" rel="noopener">Open in new tab &#8599;</a></div><div class="small mute" style="padding:6px 14px">If you see a robot check, a blank page or a login loop, use the "Open DeepSeek" pop-out button instead (sites can refuse to run inside another page).</div><iframe src="https://chat.deepseek.com/" title="DeepSeek chat" allow="clipboard-write" referrerpolicy="strict-origin-when-cross-origin"></iframe>`; }
  if (t.dataset.backread) { const key = t.dataset.backread; $("#reader").innerHTML = readerHtml(key, Math.min(S.last[key] || 0, Math.max(linksOf(key).length - 1, 0))); }
  if (t.dataset.verdict) { const [key, v] = t.dataset.verdict.split("|"); S.checks[key] = { verdict:v, date:today() };
    if (v === "correct") { S.built[key] = true; S.verified[key] = true; markActive(); const cb = document.querySelector("[data-built]"); if (cb) cb.checked = true; toast("AI check passed. You built it, and it is verified. " + pick(PRAISE), 5000); confetti(); }
    else toast(v === "partly" ? "Close. Use the hint, fix it, run it again, and check again." : "Not yet. Read the problems it listed, fix one thing, run it, and try again. This is where learning happens.", 6000);
    save(); const r = $("#chkres"); if (r) r.innerHTML = `Last check: <b>${esc(v)}</b> on ${esc(today())}`; roomProgress(key); }
  if (["updbtn", "updbtn2"].includes(t.id)) { fetch("/api/update", { method:"POST" }).then(r => r.json()).then(j => { toast(j.msg || ({ "not-a-repo":"Updates need the app folder to be a git repo. See Settings.", "no-remote":"No update source yet. Connect the FutureLab repo.", error:"Update failed: " + (j.msg || "") })[j.state] || "Done", 6000); if (j.updated) setTimeout(() => location.reload(), j.restart ? 3500 : 1500); pollUpd(); }).catch(() => toast("Server is not running.")); }
  if (t.dataset.nlm) cp(linksOf(t.dataset.nlm).map(linkUrl).join("\n"));
  if (t.dataset.finish) { const key = t.dataset.finish, x = DAYS[key], kn = S.know[key] || [], nk = x.k.filter((_, i) => kn[i]).length;
    if ((nk < x.k.length || !S.built[key]) && !t.dataset.warn) { t.dataset.warn = "1"; t.textContent = "Finish anyway"; toast("Some items are not ticked yet. Click again to finish anyway, or go back and tick them honestly.", 5000); }
    else { setDone(key, true); route(true); } }
  if (t.dataset.undo) { bump(() => { S.done[t.dataset.undo] = false; }); route(true); }
  if (t.dataset.rest) { const wk = isoWeekKey(new Date()); if ((S.rest||[]).some(r => isoWeekKey(new Date(r + "T00:00:00")) === wk)) toast("You already used this week's rest day."); else { S.rest = [...(S.rest||[]), today()]; save(); toast("Rest day taken. Your streak is safe. Rest is part of learning."); route(true); } }
  if (["syncbtn","syncbtn2","syncbtn3"].includes(t.id)) { fetch("/api/sync", { method:"POST" }).then(() => { toast("Syncing to GitHub..."); setTimeout(pollGh, 4000); }).catch(() => toast("Server is not running.")); }
  if (t.id === "startbtn") { if (!S.timer.running) { S.timer.startedAt = Date.now(); S.timer.running = true; save(); } const nt = nextTask(); location.hash = nt.d ? `day/${nt.w}/${nt.d}` : `week/${nt.w}`; }
  if (t.id === "tpp") timerToggle();
  if (t.id === "tstop") timerStop();
  if (t.id === "trec") { const w = +location.hash.split("/")[1], k = WK[w-1], did = $("#tdo").checked, sc = +$("#tsc").value, need = Math.ceil(k.testAsk.length*0.75), ok = did && sc >= need;
    const up = bump(() => { S.tests[w] = { did, score: sc, passed: ok, date: ok ? new Date().toISOString() : (S.tests[w]||{}).date }; if (ok) { markActive(); refreshWeekPost(w); } });
    if (ok) { toast((up ? `LEVEL UP! Level ${up}: ${titleOf(up)}. ` : "") + pick(TESTPASS) + " Your week post is in LinkedIn.", 6000); route(true); }
    else $("#tmsg").textContent = did ? `Not yet: ${sc}/${k.testAsk.length}. Re-read the weak spots and try again tomorrow. No shame in a retake.` : "Do the practical task first, without AI help, then record the result."; }
});
$("#q").addEventListener("keydown", e => { if (e.key === "Enter" && e.target.value.trim()) location.hash = "search/" + encodeURIComponent(e.target.value.trim()); });
document.addEventListener("keydown", e => { if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "f") { e.preventDefault(); $("#q").focus(); } });
$("#ic-search").innerHTML = ic("search"); $("#ic-mail").innerHTML = ic("mail", 20); $("#ic-bell").innerHTML = ic("bell", 20);
window.addEventListener("hashchange", () => route());
load().then(() => { route(); pollGh(); pollUpd(); setInterval(pollGh, 15000); setInterval(pollUpd, 6 * 3600 * 1000); });
</script>
